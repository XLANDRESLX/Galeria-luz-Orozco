<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUZ ELENA OROZCO — Evidencias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  <link rel="preconnect" href="https://drive.usercontent.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo animado: orbes de luz + destellos + líneas -->
  <div class="bg-lines" aria-hidden="true">
    <div class="bg-lines__orbe bg-lines__orbe--1"></div>
    <div class="bg-lines__orbe bg-lines__orbe--2"></div>
    <div class="bg-lines__orbe bg-lines__orbe--3"></div>
    <div class="bg-lines__orbe bg-lines__orbe--4"></div>
    <div class="bg-lines__destellos" id="bgDestellos"></div>
    <div class="bg-lines__line bg-lines__line--1"></div>
    <div class="bg-lines__line bg-lines__line--2"></div>
    <div class="bg-lines__line bg-lines__line--3"></div>
    <div class="bg-lines__line bg-lines__line--4"></div>
    <div class="bg-lines__line bg-lines__line--5"></div>
    <div class="bg-lines__line bg-lines__line--6"></div>
  </div>

  <!-- Halo que sigue al puntero -->
  <div class="bg-luz" aria-hidden="true"></div>

  <!-- Barra de progreso de lectura -->
  <div class="scroll-progreso" aria-hidden="true">
    <span class="scroll-progreso__barra" id="scrollProgresoBarra"></span>
  </div>

  <header class="header">
    <span class="header__brillo" aria-hidden="true"></span>
    <button id="btnLogout" class="header__logout" aria-label="Cerrar sesión" title="Cerrar sesión">&nbsp;&#x21AA;&nbsp;</button>
    <p class="header__institucion">Institución Educativa</p>
    <h1 class="header__nombre-institucion">Isaac J. Pereira</h1>
    <div class="header__divisor" aria-hidden="true">
      <span class="header__linea"></span>
      <span class="header__estrella">&#9733;</span>
      <span class="header__linea"></span>
    </div>
    <p class="header__titulo">Luz Elena Orozco PTA</p>
    <p class="header__subtitulo">Evidencias &middot; Galería multimedia</p>
  </header>

  <div id="login" class="login">
    <div class="login__card">
      <h2 class="login__titulo">Acceso restringido</h2>
      <p class="login__descripcion">Ingrese sus credenciales para acceder a la galería</p>
      <div class="login__campo">
        <input type="text" id="loginUser" class="login__input" placeholder="Usuario" autocomplete="username">
      </div>
      <div class="login__campo">
        <input type="password" id="loginPass" class="login__input" placeholder="Contraseña" autocomplete="current-password">
      </div>
      <button id="loginBtn" class="login__btn">Ingresar</button>
      <p id="loginError" class="login__error"></p>
    </div>
  </div>

  <main id="galeria" class="galeria"></main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Visor multimedia">
    <button class="lightbox__cerrar" id="btnCerrarLightbox" aria-label="Cerrar">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" id="btnPrevLightbox" aria-label="Anterior">&lsaquo;</button>
    <button class="lightbox__nav lightbox__nav--next" id="btnNextLightbox" aria-label="Siguiente">&rsaquo;</button>
    <div class="lightbox__contenido" id="contenidoLightbox"></div>
    <span class="lightbox__contador" id="lightboxContador"></span>
    <button class="lightbox__toolbar lightbox__toolbar--slideshow" id="btnSlideshowLightbox" aria-label="Slideshow">&#9654;</button>
    <div class="lightbox__velocidad">
      <label class="lightbox__velocidad-label" for="rangoVelocidad">Vel.</label>
      <input type="range" class="lightbox__velocidad-input" id="rangoVelocidad" min="1" max="10" step="0.5" value="4">
      <span class="lightbox__velocidad-valor" id="velocidadValor">4s</span>
    </div>
  </div>


  <button id="btnArriba" class="btn-arriba" aria-label="Volver arriba">&#8593;</button>

  <nav class="float-nav" aria-label="Categorías de la galería"></nav>

  <script src="script.js"></script>
</body>
</html>
